# The site of the sheets of documentation/: built by `uv run --locked --only-group docs mkdocs build --strict`
# (docs.yml), published on GitHub Pages by hand (documentation/accessibilite_pour_docu.md).
site_name: Documentation de K-B
# The address GitHub Pages gives the repository; with it, Mermaid is loaded only by a page with a diagram.
site_url: https://sabinelaurent.github.io/K-B/
docs_dir: documentation

# The bar at the top holds the documentation and two pages of the repository; the menu on the left holds the home
# page, then the parts of the documentation, numbered (Sabine's choices of 2026-11-18, issue 649).
nav:
  - Documentation:
      - K-B, mon outil de veille tech: index.md
      - 1. Démarrer:
          - installation_pour_docu.md
          - architecture_pour_docu.md
          - maquettes-et-parcours.md
      # In the order of the data: collected, queried, imported, modelled, sorted, served (issue 685).
      - 2. Les données:
          - collecte.md
          - requetes.md
          - import_et_base_pour_docu.md
          - modele-de-donnees.md
          - donnees-personnelles.md
          - api-donnees.md
      - 3. La brique d'intelligence artificielle:
          - api_ia_pour_docu.md
          - service_ia_pour_docu.md
          - monitoring_pour_docu.md
      - 4. Qualité et livraison:
          - tests_pour_docu.md
          - integration_continue_pour_docu.md
          - livraison_continue_pour_docu.md
      # Without a number, and in the footer too, so the page keeps its table of contents (Sabine's choice, issue 654).
      - Accessibilité: accessibilite_pour_docu.md
  - Le dépôt GitHub: https://github.com/SabineLaurent/K-B
  - Le journal des décisions: https://github.com/SabineLaurent/K-B/blob/main/docs/ADR/journal-decisions-projet.md

theme:
  name: material
  language: fr
  # The footer of the site: overrides/partials/copyright.html.
  custom_dir: overrides
  # No Google Fonts: the fonts of the system, no request out of the site.
  font: false
  # A bar of tabs at the top, kept in view while scrolling; one menu, on the left, with the parts as sections and the
  # table of contents of the page under its link (issue 649).
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - toc.integrate
  # A light mode and a dark mode: the system's at the first visit, then the mode kept, changed by the button of the
  # header. The colours of both are in documentation/stylesheets/extra.css.
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Passer au mode sombre
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Passer au mode clair

# The colours of the back office of K-B, the tabs, and a link underlined (documentation/accessibilite_pour_docu.md).
extra_css:
  - stylesheets/extra.css
# The search results out of the Tab key (issue 654); « K-B », and a date and a word of code in a table, on one line.
extra_javascript:
  - javascripts/search-list.js
  - javascripts/nowrap.js

plugins:
  - search
  # Downloads at the build what the theme would load from elsewhere (Mermaid from unpkg), served with the site.
  - privacy

markdown_extensions:
  # The box of the competences at the head of a sheet: `!!! note "Compétences de la certification"`.
  - admonition
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# Each of these is a warning, so a failure of `mkdocs build --strict`.
validation:
  nav:
    omitted_files: warn
  links:
    anchors: warn
    unrecognized_links: warn

# No "Made with Material for MkDocs" in the footer: an English text, and a link that opens a new window.
extra:
  generator: false
