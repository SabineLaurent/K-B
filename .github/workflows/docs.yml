name: Docs

# The site of documentation/ (mkdocs.yml): built in strict mode on each pull request, so a broken link, a
# missing anchor or a sheet left out of the navigation fails it; published on GitHub Pages at each push to
# main once the repository variable PAGES_PUBLISH is true, set when Pages is turned on, and by hand
# (documentation/accessibilite.md, "Publier"). Before, the deployment is skipped: it would fail.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Actions are pinned by full commit SHA, version in the comment (Dependabot updates both).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6" # the uv of the Dockerfile, in the uv_build range of pyproject.toml
          save-cache: false # the jobs share one cache key: only tests saves it
      # The docs group only, pinned by uv.lock: neither K-B nor its dev tools.
      - run: uv run --locked --only-group docs mkdocs build --strict
      # The privacy plugin downloads Mermaid from unpkg, in its moving version 11 (mermaid@11): the build
      # fails unless the file is the one of the npm package of mermaid 11.17.2, checked on 2026-11-14 against
      # the integrity npm publishes for it (documentation/accessibilite.md, "Limites").
      - run: echo "581ed7d74bd9048d0e3a91363927d72ef22942d7722546b27f7cc29e35390eb8  site/assets/external/unpkg.com/mermaid@11/dist/mermaid.min.js" | sha256sum --check
      - if: >-
          github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch'
          || (github.event_name == 'push' && vars.PAGES_PUBLISH == 'true'))
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/

  deploy:
    # From main only (a dispatch can name any branch): at each push once PAGES_PUBLISH is true, or by hand.
    if: >-
      github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push' && vars.PAGES_PUBLISH == 'true'))
    needs: build
    # One deployment at a time, never cancelled once running; GitHub keeps one pending and cancels it when a newer
    # one comes (documentation/accessibilite.md, "Publier").
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # Only this job writes to Pages, with the token of the deployment.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
