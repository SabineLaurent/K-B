name: Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Builds the image of K-B for Azure Container Apps, which runs linux/amd64 images only, then checks
# it (issue #200). Nothing is pushed: the registry and the delivery are #415.
jobs:
  image-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Files that .dockerignore keeps out of the build: planted where the build copies from (src/)
      # and at the root, then looked for in the image.
      - run: |
          mkdir -p temp reports
          touch .env .env.decoy temp/decoy reports/decoy src/k_b/.env.decoy src/k_b/decoy.sqlite
      - run: docker buildx build --platform linux/amd64 --tag k-b:ci .
      - name: Runs as a non-root user
        # In a variable, so that a failed docker run fails the step (bash -e); -ne refuses an empty value.
        run: |
          uid=$(docker run --rm --entrypoint id k-b:ci -u)
          test "$uid" -ne 0
      # As root, to read every folder of the image.
      - name: Holds none of the planted files
        run: |
          found=$(docker run --rm --user 0 --entrypoint find k-b:ci / -xdev \( -name '.env*' -o -name '*.sqlite' -o -name decoy -o -name .git \) -print)
          test -z "$found" || { echo "$found"; exit 1; }
      # create-db runs the SQL of k_b.database, read from the installed package, and writes in /data.
      - name: Starts kb and creates the database
        run: |
          docker run --rm k-b:ci --help
          docker run --rm k-b:ci create-db
