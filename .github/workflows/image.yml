name: Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Builds the image of K-B for Azure Container Apps, which runs linux/amd64 images only, then checks
# it (issue #200) and scans it (#498). Nothing is pushed: the registry and the delivery are #415.
# A required check of main (#498): no path filter, since a check that a filter skips stays pending and
# blocks the merge.
jobs:
  image-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Files that .dockerignore keeps out of the build context, planted at the root and in src/k_b/
      # (the build backend packs every file of src/k_b/), then looked for in the context and in the
      # image. .git/ is there already, from the checkout.
      - run: |
          mkdir -p temp reports .venv
          touch .env .env.decoy temp/decoy reports/decoy .venv/decoy
          touch src/k_b/.env.decoy src/k_b/decoy.sqlite src/k_b/decoy.sqlite-wal src/k_b/.DS_Store
          mkdir -p src/k_b/__pycache__ && touch src/k_b/__pycache__/decoy.pyc
      # The context a builder receives, a remote one included, written whole to a folder (no image):
      # the four paths the Dockerfile copies, and none of the planted files.
      - name: Sends only what the Dockerfile copies to the build
        run: |
          context="$RUNNER_TEMP/context"
          printf 'FROM scratch\nCOPY . /\n' | docker buildx build --file - --output "type=local,dest=$context" .
          diff <(LC_ALL=C ls -A "$context") <(printf '%s\n' README.md pyproject.toml src uv.lock)
          found=$(find "$context" \( -name '.env*' -o -name '*.sqlite*' -o -name decoy -o -name .DS_Store -o -name __pycache__ \) -print)
          test -z "$found" || { echo "$found"; exit 1; }
      - run: docker buildx build --platform linux/amd64 --tag k-b:ci .
      - name: Runs as a non-root user
        # In a variable, so that a failed docker run fails the step (bash -e); -ne refuses an empty value.
        run: |
          uid=$(docker run --rm --entrypoint id k-b:ci -u)
          test "$uid" -ne 0
      # As root, to read every folder of the image.
      - name: Holds none of the planted files
        run: |
          found=$(docker run --rm --user 0 --entrypoint find k-b:ci / -xdev \( -name '.env*' -o -name '*.sqlite*' -o -name decoy -o -name .DS_Store -o -name .git \) -print)
          test -z "$found" || { echo "$found"; exit 1; }
      # KB_DATA_DIR has no default (.claude/rules/poc.md, rule 2): a container without it fails at
      # its start, rather than writing in a folder that is not its volume.
      - name: Refuses to start without KB_DATA_DIR
        run: |
          exit_code=0
          error=$(docker run --rm k-b:ci create-db 2>&1) || exit_code=$?
          echo "$error"
          test "$exit_code" -eq 2
          grep -qF "KB_DATA_DIR must point to the data directory" <<< "$error"
      # create-db runs the SQL of k_b.database, read from the installed package, and writes in the
      # data directory of the image, owned by its user.
      - name: Starts kb and creates the database
        run: |
          docker run --rm k-b:ci --help
          docker run --rm -e KB_DATA_DIR=/var/lib/knowledge_base k-b:ci create-db
      # Grype (Anchore), the binary of its release, checked by its SHA256 (GitHub release asset digest), like
      # Bicep in infra.yml: update both with the version. The last version published 7 days before or more
      # (issue #498).
      - name: Installs Grype v0.121.2
        run: |
          curl -fsSL -o "$RUNNER_TEMP/grype.tar.gz" \
            https://github.com/anchore/grype/releases/download/v0.121.2/grype_0.121.2_linux_amd64.tar.gz
          echo "9c8965ced9df657e5e851c14021bae838802f711edd7a48f9bc3c923a8d28f12  $RUNNER_TEMP/grype.tar.gz" | sha256sum -c
          tar -xzf "$RUNNER_TEMP/grype.tar.gz" -C "$RUNNER_TEMP" grype
      # Debian packages, Python packages (the virtual environment, and pip of the base image) and CPython:
      # what Grype finds in the final filesystem of the image. --fail-on counts what --only-fixed keeps: a
      # high or critical vulnerability that has a fix. The database is downloaded at each run, and refused
      # if built more than 5 days before (Grype's default). No check for a newer Grype: its version is
      # pinned above. Last step, so that a red scan does not hide the result of the checks above.
      - name: Has no high or critical vulnerability that has a fix
        env:
          GRYPE_CHECK_FOR_APP_UPDATE: "false"
        run: |
          "$RUNNER_TEMP/grype" docker:k-b:ci --only-fixed --fail-on high
