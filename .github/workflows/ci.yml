name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Actions are pinned by full commit SHA, version in the comment (Dependabot updates both).
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          save-cache: false # the four jobs share one cache key: only tests saves it
      - run: uv sync --locked
      # Audit the versions pinned by uv.lock, with their hashes, against known vulnerabilities.
      - run: uv export --frozen --no-emit-project --format requirements-txt -o requirements-audit.txt
      - run: uvx pip-audit@2.10.1 --require-hashes --disable-pip -r requirements-audit.txt

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - run: uv run pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          save-cache: false # the four jobs share one cache key: only tests saves it
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          save-cache: false # the four jobs share one cache key: only tests saves it
      - run: uv sync --locked
      - run: uv run mypy --strict
