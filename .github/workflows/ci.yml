name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Actions are pinned by full commit SHA, version in the comment (Dependabot updates both).
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.6" # the uv of the Dockerfile, in the uv_build range of pyproject.toml
          save-cache: false # the jobs share one cache key: only tests saves it
      - run: uv sync --locked
      # Audit the versions pinned by uv.lock, with their hashes, against known vulnerabilities:
      # every group, docs included, which uv export leaves out by default.
      - run: uv export --frozen --no-emit-project --all-groups --format requirements-txt -o requirements-audit.txt
      - run: uvx pip-audit@2.10.1 --require-hashes --disable-pip -r requirements-audit.txt

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.6" # the uv of the Dockerfile, in the uv_build range of pyproject.toml
      - run: uv sync --locked
      # The tests and the coverage of make test-cov, without its markdown report: fails under
      # fail_under of pyproject.toml.
      - run: uv run pytest --cov --cov-report=term-missing:skip-covered

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.6" # the uv of the Dockerfile, in the uv_build range of pyproject.toml
          save-cache: false # the jobs share one cache key: only tests saves it
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.6" # the uv of the Dockerfile, in the uv_build range of pyproject.toml
          save-cache: false # the jobs share one cache key: only tests saves it
      - run: uv sync --locked
      - run: uv run mypy --strict

  # The tests marked postgresql (#417: the writing; #418: the reading), on a server of the major
  # version Azure runs (18). The image of the service is pinned by its digest, which Dependabot
  # does not update (it updates the uses: of a workflow only): to change by hand.
  tests-postgresql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6@sha256:bd5dfa494a5a259704365813dbfa5fa6b3e69be7348d43b547f540c730478583
        env:
          POSTGRES_USER: kb
          # A server of this job only, reached from the runner alone: no password to keep.
          POSTGRES_HOST_AUTH_METHOD: trust
          # The settings kb create-db asks of a base: UTF8, collation C.
          POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username kb"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      KB_TEST_POSTGRESQL_URL: postgresql://kb@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.6" # the uv of the Dockerfile, in the uv_build range of pyproject.toml
          save-cache: false # the jobs share one cache key: only tests saves it
      - run: uv sync --locked
      - run: uv run pytest -m postgresql

  # The tests of the data, apart from the others (#481): before the base, the ETL, the schema and
  # the common item every source is read into; before the model, the items as the AI API sends
  # them. They also run in tests, which keeps the coverage threshold of the whole suite. The
  # postgresql test of tests/etl stays out, as everywhere but in tests-postgresql. Last in the
  # file, so the line numbers other documents cite do not move.
  tests-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.6" # the uv of the Dockerfile, in the uv_build range of pyproject.toml
          save-cache: false # the jobs share one cache key: only tests saves it
      - run: uv sync --locked
      - run: uv run pytest tests/etl tests/test_schema.py tests/test_items.py tests/ai_api/test_watch_items.py

  # The reference set of POST /digests (#479), replayed and judged against the thresholds of 15/10
  # (#482): 100 % of schemas valid after a new attempt, a fidelity of at least 95 %, no item
  # forgotten. The report is an artifact of the run, kept even when a threshold is not met:
  # gh run download <id> -n digests-reference-report. Last in the file, as tests-data.
  digests-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.6" # the uv of the Dockerfile, in the uv_build range of pyproject.toml
          save-cache: false # the jobs share one cache key: only tests saves it
      - run: uv sync --locked
      - run: uv run python tests/ai_api/digests_evaluation.py reports/digests-reference-report.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }} # the report of a failing run is the one to read
        with:
          name: digests-reference-report
          path: reports/digests-reference-report.md
          if-no-files-found: error
          retention-days: 30 # numbers only, read at the review of a PR (RGESN 1.6)
