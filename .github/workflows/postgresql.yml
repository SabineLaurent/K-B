name: PostgreSQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# The tests marked postgresql (#417: the writing; the reading joins them with #418), on a server of
# the major version Azure will run (18). Actions are pinned by full commit SHA, version in the
# comment; the image of the service by its digest, which Dependabot does not update (it updates
# the uses: of a workflow only): to change by hand.
jobs:
  tests-postgresql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6@sha256:bd5dfa494a5a259704365813dbfa5fa6b3e69be7348d43b547f540c730478583
        env:
          POSTGRES_USER: kb
          # A server of this job only, reached from the runner alone: no password to keep.
          POSTGRES_HOST_AUTH_METHOD: trust
          # The settings kb create-db asks of a base: UTF8, collation C.
          POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username kb"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      KB_TEST_POSTGRESQL_URL: postgresql://kb@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          save-cache: false # the jobs of ci.yml share the cache key: only its tests job saves it
      - run: uv sync --locked
      - run: uv run pytest -m postgresql
