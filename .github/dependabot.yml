version: 2
updates:
  # Keeps the SHA-pinned actions of .github/workflows/ up to date, with their version comment.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7 # a new version waits 7 days (default 3); security updates are never delayed
  # Keeps the digest-pinned base images of the Dockerfile up to date, with their tag.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7 # same delay as the actions
    # The cooldown needs the publication date of a version, which ghcr.io does not give: for
    # astral-sh/uv, Dependabot opens the pull request at once ("Cooldown could not be applied", #444).
    # Before merging a docker update, check the date of the version by hand (journal ADR, #414).
    # Digest and patch updates only: a minor update changes the tag itself (3.13-slim-trixie to
    # 3.14-slim-trixie: same suffix, higher version, dependabot-core docker/README.md, "Semver").
    # Python stays at the 3.13 of .python-version; uv in the uv_build range of pyproject.toml. A patch
    # update of astral-sh/uv changes the uv of setup-uv in ci.yml (6 jobs) and docs.yml too, by hand.
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "astral-sh/uv"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
