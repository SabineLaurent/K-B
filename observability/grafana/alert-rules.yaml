# The alerts of the model of K-B, in the format of Prometheus rules, imported into Grafana Cloud by
# "Import to Grafana-managed rules" (documentation/monitoring_pour_docu.md). One alert per
# environment: each sum is by deployment_environment_name, sandbox or production.
#
# The thresholds: the reading grid of Sabine of 2026-10-15 (docs/ADR/journal-decisions-projet.md,
# "100 % of valid outputs after a new attempt, at least 95 % of fidelity"), and her thresholds of
# 2026-11-18 for gpt-6.1-sol: 2 USD over 7 days, above its normal maximum of 1.55 USD a week; no call
# failed after its new attempt over 24 h; no request of a report beyond 180 seconds over 24 h, under
# its deadline of 200. The threshold of an alert is the number its expression ends with: the
# dashboard and the sandbox read it there (tests/test_grafana_files.py).
#
# A request beyond 180 seconds is its count less its bucket of 180. The bucket is read as 180 or
# 180.0, the two forms of le in Prometheus; the one Grafana Cloud gives it is not seen yet.
#
# Each total is the sum over the series of their max_over_time: each process of the AI API is a
# new series, whose first increment increase() does not see (12 calls of 21 in the sandbox of
# 2026-11-08). The windows are long, as the digests come out twice a week; without a call, there is
# no series, and the alert stays normal.
# The fidelity divides by the facts checked only when there is one: 0 facts would give NaN, which
# no comparison catches, and the alert stays normal without data.
groups:
  - name: k-b-model
    interval: 5m
    rules:
      - alert: KbModelInvalidOutputs
        expr: |
          sum by (deployment_environment_name) (max_over_time(k_b_llm_calls_total{k_b_outcome="llm_invalid_output"}[24h]))
            / sum by (deployment_environment_name) (max_over_time(k_b_llm_calls_total[24h]))
            > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "K-B, {{ $labels.deployment_environment_name }}: sorties invalides du modèle sur 24 h, au-dessus du seuil de 0 %"
          description: "Part des appels au modèle refusés après leur nouvelle tentative (llm_invalid_output) sur 24 h: {{ humanizePercentage $value }}. Tableau de bord: K-B, modèle."
      - alert: KbModelLowFidelity
        expr: |
          sum by (deployment_environment_name) (max_over_time(k_b_digest_facts_found_total[24h]))
            / (sum by (deployment_environment_name) (max_over_time(k_b_digest_facts_checked_total[24h])) > 0)
            < 0.95
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "K-B, {{ $labels.deployment_environment_name }}: fidélité des fiches sur 24 h, sous le seuil de 95 %"
          description: "Part des faits retrouvés à la fois dans le texte où ils sont affirmés et dans leur source: l'item que chacun désigne, pour les fiches de veille, la source de leur texte, pour le compte rendu des tendances. Sur 24 h: {{ humanizePercentage $value }}. Tableau de bord: K-B, modèle."
      - alert: KbModelCostOverBudget
        expr: |
          sum by (deployment_environment_name) (max_over_time(k_b_llm_cost_total[7d]))
            > 2
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "K-B, {{ $labels.deployment_environment_name }}: coût estimé du modèle sur 7 jours, au-dessus du budget de 2 USD"
          description: "Coût estimé des appels au modèle sur 7 jours, aux prix de core/config.py: {{ humanize $value }} USD. Tableau de bord: K-B, modèle."
      - alert: KbModelCallFailures
        expr: |
          sum by (deployment_environment_name) (max_over_time(k_b_llm_calls_total{k_b_outcome=~"llm_timeout|llm_unavailable|llm_rate_limited|llm_content_filtered"}[24h]))
            / sum by (deployment_environment_name) (max_over_time(k_b_llm_calls_total[24h]))
            > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "K-B, {{ $labels.deployment_environment_name }}: appels au modèle en échec sur 24 h, au-dessus du seuil de 0 %"
          description: "Part des appels au modèle en échec après leur nouvelle tentative, sur 24 h: délai dépassé (llm_timeout), service indisponible (llm_unavailable), trop de requêtes (llm_rate_limited) ou filtre de contenu (llm_content_filtered). {{ humanizePercentage $value }}. Tableau de bord: K-B, modèle."
      - alert: KbRequestOverDuration
        expr: |
          (sum by (deployment_environment_name) (max_over_time(k_b_request_duration_seconds_count[24h]))
            - sum by (deployment_environment_name) (max_over_time(k_b_request_duration_seconds_bucket{le=~"180|180.0"}[24h])))
            / sum by (deployment_environment_name) (max_over_time(k_b_request_duration_seconds_count[24h]))
            > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "K-B, {{ $labels.deployment_environment_name }}: demandes de compte rendu de plus de 180 s sur 24 h, au-dessus du seuil de 0 %"
          description: "Part des demandes de compte rendu (POST /digests, POST /trend-reports) de plus de 180 s, sous l'échéance de 200 s, sur 24 h: {{ humanizePercentage $value }}. Tableau de bord: K-B, modèle."
