[project]
name = "k-b"
version = "0.1.0"
description = "Une bibliothèque de veille tech qui se range toute seule."
readme = "README.md"
authors = [
    { name = "Sabine Laurent" }
]
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["uv_build>=0.11.13,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[project.scripts]
kb = "k_b.cli:main"

[tool.ruff.lint]
extend-select = ["S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert est l'outil des tests
