[project]
name = "k-b"
version = "0.1.0"
description = "Une bibliothèque de veille tech qui se range toute seule."
readme = "README.md"
authors = [
    { name = "Sabine Laurent" }
]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "defusedxml>=0.7.1",
    "fastapi>=0.122",
    "google-cloud-bigquery>=3.46,<4",
    "httpx2>=2.13.1",
    "opentelemetry-api>=1.45.1,<1.46",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1,<1.46",
    "opentelemetry-sdk>=1.45.1,<1.46",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.13,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "openapi-spec-validator>=0.9.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-html>=4.2.0",
    "ruff>=0.16.10",
    "types-defusedxml>=0.7.0.20260504",
    "types-pyyaml>=6.0.12.20260906",
]

[project.scripts]
kb = "k_b.cli:main"

[tool.ruff.lint]
extend-select = ["I", "B", "UP", "S", "N", "SIM", "C90", "D100", "D102", "D103"]
# D100, D102, D103 : une docstring sur chaque module, méthode et fonction publics du pipeline ETL
# (.claude/rules/code.md, exception du 2026-11-02) ; le reste en est exempté plus bas.
# Règles actives par défaut depuis ruff 0.16, hors de .claude/rules/outillage.md : désactivées
# tant que Sabine n'a pas décidé (2026-10-06).
ignore = ["TRY004", "DTZ001", "RUF012", "PLR0402", "PLW1510"]

[tool.ruff.format]
# Les notes datées de docs/ recopient le code tel qu'il était : ruff ne formate que le Python.
exclude = ["*.md"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D100", "D102", "D103"]  # assert est l'outil des tests
# Hors du pipeline ETL (de cli.py à l'écriture en base) : pas de docstring exigée.
"src/k_b/{ai_api,data_api,post}/**" = ["D100", "D102", "D103"]
"src/k_b/commands/{create_db,digest,openapi,serve_ai,serve_data,trend_report,write_tops}_command.py" = ["D100", "D102", "D103"]
"src/k_b/commands/wait_display.py" = ["D100", "D102", "D103"]
"src/k_b/core/api_*.py" = ["D100", "D102", "D103"]
"src/k_b/database/creation.py" = ["D100", "D102", "D103"]

[tool.mypy]
files = ["src"]

[tool.coverage.run]
# Couverture des tests : `uv run pytest --cov --cov-report=term-missing` (README, « Lancer les tests »).
source = ["k_b"]
# Compte aussi les branches jamais prises d'un `if`, pas seulement les lignes.
branch = true
# pytest-cov 7 ne mesure plus les sous-processus : des tests lancent un processus enfant.
patch = ["subprocess"]
