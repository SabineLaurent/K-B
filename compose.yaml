# The local preproduction of K-B (issue #419): the image of production and PostgreSQL 18, locally,
# hardened beyond the containers online. One image, built here, for every kb service.
#
#   docker compose build
#   docker compose run --rm create-db
#   docker compose run --rm collecte; echo $?
#   docker compose run --rm import; echo $?
#   docker compose up -d
#
# Each service reads its secrets from its file, .env.<service>, ignored by git: a copy of its
# template .env.<service>.example, filled in by the operator. Its other settings are below.
# Departures from production: KB_DEPLOYMENT_ENVIRONMENT=sandbox for the AI API, the only
# environment where kb calls a service of the compose in http (http://api-donnees:8000); one role,
# superuser of the server and owner of the base, and kb create-db rather than kb migrate-database,
# which grants the roles of Azure; an init process; a read-only file system with /tmp in memory, where the file system of a
# container online is writable.

# The resources of each kb service: a combination of Azure Container Apps, the one of the apps
# online (infra/modules/api-container-app.bicep:154-155;
# https://learn.microsoft.com/en-us/azure/container-apps/containers, "Allocations", read on
# 2026-11-21). Below 30 s to stop (issue #419). An init process forwards the stop signal and reaps.
x-container: &container
  init: true
  read_only: true
  tmpfs:
    - /tmp
  cpus: 0.5
  mem_limit: 1g
  stop_grace_period: 20s

# The image of production (Dockerfile), for linux/amd64 as online; it runs as 10001.
x-kb: &kb
  <<: *container
  image: k-b:preprod
  platform: linux/amd64

# No volume for the APIs, as online (infra/main.bicep:69-72): only the jobs keep it.
x-kb-environment: &kb-environment
  KB_DATA_DIR: /var/lib/knowledge_base

# GET /health with a host the API allows; the image has python, not curl.
x-api-healthcheck: &api-healthcheck
  interval: 5s
  timeout: 3s
  retries: 12

services:
  # The server of the tests on PostgreSQL in the CI, same image and initdb settings (ci.yml), the
  # major version Azure runs. Reached by the compose network only: no port published.
  postgres:
    <<: *container
    image: postgres:18.6@sha256:bd5dfa494a5a259704365813dbfa5fa6b3e69be7348d43b547f540c730478583
    user: postgres
    # The server of the base online, Standard_B1ms: 1 vCore, 2 GiB
    # (infra/modules/postgresql-server.bicep:21;
    # https://learn.microsoft.com/en-us/azure/postgresql/compute-storage/concepts-compute, read on
    # 2026-11-22).
    cpus: 1
    mem_limit: 2g
    tmpfs:
      - /tmp
      # Its socket and its lock file.
      - /var/run/postgresql
    environment:
      POSTGRES_USER: kb
      POSTGRES_DB: k_b
      # The settings kb create-db asks of a base: UTF8, collation C.
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
    env_file:
      - path: .env.postgres
        required: true
    volumes:
      # The volume the image declares from PostgreSQL 18 on.
      - pg-data:/var/lib/postgresql
    healthcheck:
      # Over TCP: the temporary server of the first start, which creates the base, answers on the
      # socket only (docker-entrypoint.sh, docker_temp_server_start).
      test: ["CMD", "pg_isready", "--host", "127.0.0.1", "--username", "kb", "--dbname", "k_b"]
      interval: 2s
      timeout: 5s
      retries: 15

  api-donnees:
    <<: *kb
    build:
      context: .
    command: ["serve-data"]
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      <<: *kb-environment
      KB_DATA_API_HOST: 0.0.0.0
      KB_DATA_API_PORT: "8000"
      KB_DATA_API_ALLOWED_HOSTS: 127.0.0.1,localhost,api-donnees
      # As online (infra/main.bicep:296): neither /docs nor /openapi.json.
      KB_DEPLOYMENT_ENVIRONMENT: production
    env_file:
      - path: .env.api-donnees
        required: true
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      <<: *api-healthcheck
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/health', headers={'Host': '127.0.0.1'}), timeout=2)"

  api-ia:
    <<: *kb
    command: ["serve-ai"]
    # As online (infra/main.bicep:337-339): the longest request the ingress lets through, 240 s,
    # and a margin. A digest request is bound to 200 s (DIGEST_REQUEST_TIMEOUT_SECONDS), plus the
    # call to the model under way.
    stop_grace_period: 250s
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      <<: *kb-environment
      KB_AI_API_HOST: 0.0.0.0
      KB_AI_API_PORT: "8001"
      # The only environment where kb calls a service of the compose in http (core/outbound.py).
      KB_DEPLOYMENT_ENVIRONMENT: sandbox
      KB_DATA_API_URL: http://api-donnees:8000
      # The model and the effort of production (infra/main.bicep:327-331).
      KB_LLM_PROVIDER: openai_compatible
      KB_LLM_MODEL: gpt-6.1-sol
      KB_LLM_REASONING_EFFORT: low
    env_file:
      - path: .env.api-ia
        required: true
    depends_on:
      api-donnees:
        condition: service_healthy
    healthcheck:
      <<: *api-healthcheck
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8001/health', headers={'Host': '127.0.0.1'}), timeout=2)"

  # The jobs, run one by one (docker compose run --rm <job>), on the volume of the data directory.
  create-db:
    <<: *kb
    profiles: ["jobs"]
    command: ["create-db"]
    environment:
      <<: *kb-environment
    env_file:
      - path: .env.jobs
        required: true
    volumes:
      - kb-data:/var/lib/knowledge_base
    depends_on:
      postgres:
        condition: service_healthy

  # Every source that has its variable: neither Zotero nor the vault, mounted on the host only, nor
  # GH Archive without its key; KB_COLLECT_ONLY is never set empty.
  collecte:
    <<: *kb
    profiles: ["jobs"]
    command: ["collect"]
    environment:
      <<: *kb-environment
    env_file:
      - path: .env.jobs
        required: true
    volumes:
      - kb-data:/var/lib/knowledge_base

  import:
    <<: *kb
    profiles: ["jobs"]
    command: ["import"]
    environment:
      <<: *kb-environment
    env_file:
      - path: .env.jobs
        required: true
    volumes:
      - kb-data:/var/lib/knowledge_base
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pg-data:
  kb-data:
